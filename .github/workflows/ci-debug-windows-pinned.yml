name: ci-debug-windows-pinned-winonly

on: [push]

# Cancel in-progress runs when a new push is made to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies (original pinned requirements.txt)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # visual tests are very finiky so fix the versions
        pip install . # install pyopenms-viz
    - name: Test
      run: |
        python -m pytest --snapshot-warn-unused test/ # do not fail if unused snapshot, just warn
