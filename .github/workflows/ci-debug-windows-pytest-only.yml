name: ci-debug-windows-pytest-only

on: [push]

# Cancel in-progress runs when a new push is made to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install pytest only (no project deps, no repo checkout)
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    - name: Run pytest in empty temp dir (no test files)
      run: |
        New-Item -ItemType Directory -Path "$env:TEMP\empty_pytest" -Force
        Set-Location "$env:TEMP\empty_pytest"
        python -m pytest --collect-only
