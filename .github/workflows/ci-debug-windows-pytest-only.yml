name: ci-debug-windows-pytest-only

on: [push]

# Cancel in-progress runs when a new push is made to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pytest only (no project deps)
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    - name: Run pytest with no test files
      run: |
        python -m pytest --ignore=test --ignore=testing -p no:cacheprovider
