name: ci-debug-windows-basic

on: [push]

# Cancel in-progress runs when a new push is made to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install pytest and project (no requirements.txt pinning)
      run: |
        python -m pip install --upgrade pip
        pip install .[testing,bokeh,matplotlib,plotly]  # install project with testing extras, unpinned
    - name: Run pytest (unpinned versions)
      run: |
        python -m pytest --snapshot-warn-unused test/ # do not fail if unused snapshot, just warn
